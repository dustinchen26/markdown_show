<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>TerraEdge • BIOS 上電時序報告檢視器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:opsz@14..32&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@11/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #f5f7fb;
            font-family: 'Inter','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
            color: #1e293b; padding: 12px 10px; min-height: 100vh;
            font-size: 13.5px; line-height: 1.45;
        }
        .app-container { max-width: 1600px; margin: 0 auto; width: 100%; }
        .header { margin-bottom: 10px; }
        .header h1 { font-size: 18px; line-height: 1.3; margin-bottom: 8px; }
        .upload-area {
            background: #fff; border-radius: 12px; padding: 10px 16px;
            border: 1px solid #e9eef4; display: flex; flex-wrap: wrap;
            align-items: center; justify-content: space-between; gap: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .btn-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .file-btn {
            background: #1e293b; color: #fff; border: none; padding: 7px 16px;
            border-radius: 24px; cursor: pointer; transition: 0.15s;
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 13px; font-family: inherit;
        }
        .file-btn:hover { background: #0f172a; }
        .file-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
        .export-btn { background: #10b981; }
        .export-btn:hover { background: #059669; }
        .report-viewer {
            background: #fff; border-radius: 12px; padding: 14px 16px;
            margin-top: 10px; border: 1px solid #eef2f6; min-height: 300px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.04);
        }
        .loading-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(255,255,255,0.85);
            z-index: 1000; justify-content: center; align-items: center;
            font-weight: 600; font-size: 15px;
        }

        /* ================== markdown-body 完整緊湊排版 ================== */
        .markdown-body {
            font-size: 13.5px; line-height: 1.45; color: #1e293b;
            word-wrap: break-word; overflow-wrap: break-word;
        }

        /* 標題 */
        .markdown-body h1, .markdown-body h2, .markdown-body h3,
        .markdown-body h4, .markdown-body h5, .markdown-body h6 {
            font-weight: 700; line-height: 1.3; color: #0f172a;
            margin: 0.7em 0 0.35em;
        }
        .markdown-body h1 { font-size: 1.6em; border-bottom: 1px solid #eef2f6; padding-bottom: 0.2em; margin-top: 0; }
        .markdown-body h2 { font-size: 1.32em; border-bottom: 1px solid #eef2f6; padding-bottom: 0.15em; }
        .markdown-body h3 { font-size: 1.14em; }
        .markdown-body h4 { font-size: 1.02em; }
        .markdown-body h5, .markdown-body h6 { font-size: 0.96em; color: #475569; }

        /* 段落 */
        .markdown-body p { margin: 0.35em 0; }
        .markdown-body p:first-child { margin-top: 0; }
        .markdown-body p:last-child  { margin-bottom: 0; }

        /* 清單 */
        .markdown-body ul, .markdown-body ol { margin: 0.35em 0; padding-left: 1.6em; }
        .markdown-body ul { list-style: disc; }
        .markdown-body ol { list-style: decimal; }
        .markdown-body ul ul { list-style: circle; }
        .markdown-body ul ul ul { list-style: square; }
        .markdown-body ol ol { list-style: lower-alpha; }
        .markdown-body li { margin: 0.1em 0; }
        .markdown-body li > p { margin: 0.1em 0; }
        .markdown-body li > ul, .markdown-body li > ol { margin: 0.1em 0; }

        .markdown-body li.task-list-item { list-style: none; margin-left: -1.4em; padding-left: 1.4em; }
        .markdown-body li.task-list-item input { margin-right: 0.4em; vertical-align: middle; }

        /* 引用 */
        .markdown-body blockquote {
            margin: 0.5em 0; padding: 0.35em 0.9em;
            border-left: 3px solid #cbd5e1; background: #f8fafc;
            color: #475569; border-radius: 0 5px 5px 0;
        }

        /* 分隔線 */
        .markdown-body hr { border: 0; border-top: 1px solid #eef2f6; margin: 0.8em 0; }

        /* 文字樣式 */
        .markdown-body a { color: #2563eb; text-decoration: none; }
        .markdown-body a:hover { text-decoration: underline; }
        .markdown-body strong { font-weight: 700; color: #0f172a; }
        .markdown-body em { font-style: italic; }
        .markdown-body del { text-decoration: line-through; color: #94a3b8; }
        .markdown-body img { max-width: 100%; height: auto; border-radius: 4px; }

        /* 行內程式碼 */
        .markdown-body :not(pre) > code {
            background: #f1f5f9; padding: 1px 5px; border-radius: 3px;
            font-family: 'JetBrains Mono', monospace; font-size: 0.88em;
            color: #be185d; word-break: break-word;
        }

        /* 程式碼區塊 */
        .markdown-body pre {
            background: #f6f8fa; padding: 8px 12px; border-radius: 6px;
            border: 1px solid #e2e8f0; overflow-x: auto; margin: 0.5em 0;
            font-family: 'JetBrains Mono', monospace; font-size: 11.5px; line-height: 1.4;
        }
        .markdown-body pre code {
            background: transparent; padding: 0; color: inherit;
            font-size: inherit; line-height: inherit; white-space: pre; word-break: normal;
        }

        /* 表格：外套 wrapper 做橫向滾動；table 保留原生 table layout */
        .table-wrapper {
            overflow-x: auto; margin: 0.6em 0; border-radius: 5px;
            border: 1px solid #e4e9f0; background: #fff;
        }
        .markdown-body table { border-collapse: collapse; width: 100%; font-size: 12.5px; line-height: 1.35; }
        .markdown-body table th, .markdown-body table td {
            padding: 4px 9px; border: 1px solid #e4e9f0;
            text-align: left; vertical-align: top; word-break: break-word;
        }
        .markdown-body table th { background: #f8fafd; font-weight: 600; color: #0f172a; }
        .markdown-body table tbody tr:nth-child(even) td { background: #fafbfc; }
        .markdown-body table tbody tr:hover td { background: #f1f5f9; }

        /* Mermaid */
        .markdown-body .mermaid { text-align: center; margin: 0.6em 0; overflow-x: auto; }
    </style>
</head>
<body>
    <div id="loading" class="loading-overlay">解析報告中，請稍候…</div>

    <div class="app-container">
        <div class="header">
            <h1>⚡ TerraEdge BIOS • 報告檢視器</h1>
            <div class="upload-area">
                <div class="btn-group">
                    <input type="file" id="fileInput" accept=".md,.markdown,text/markdown,text/plain" style="display:none">
                    <button class="file-btn" type="button" onclick="document.getElementById('fileInput').click()">📂 選擇 .md 報告</button>
                    <button class="file-btn export-btn" id="exportWordBtn" type="button" disabled>📄 匯出 Word</button>
                    <button class="file-btn" style="background:#ef4444;" id="clearBtn" type="button">🗑️ 清空</button>
                </div>
                <span id="fileName" style="color: #64748b; font-size: 13px;">未選擇任何檔案</span>
            </div>
        </div>
        <div class="report-viewer" id="reportViewer">
            <p style="text-align:center; color:#94a3b8; padding:80px 0;">請上傳由 Python 腳本產出的 BIOS Log 分析報告</p>
        </div>
    </div>

<script>
/* ---- Mermaid 初始化 ---- */
if (window.mermaid) {
    mermaid.initialize({
        startOnLoad: false, theme: 'default', securityLevel: 'loose',
        fontFamily: 'Inter, "Noto Sans TC", sans-serif',
        flowchart: { htmlLabels: true, useMaxWidth: true },
        sequence:  { useMaxWidth: true },
        gantt:     { useMaxWidth: true }
    });
}

/* ---- marked 初始化 ---- */
marked.setOptions({
    gfm: true,
    breaks: false,
    pedantic: false,
    mangle: false,
    headerIds: false
});

/* ============================================================
   前處理 1：補空行（表格 / 圍欄 / 列表）
   前處理 2：表格內 \X 轉義保護（避免 \D 被吞成 D）
   ============================================================ */
function normalizeMarkdown(text) {
    text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    const lines = text.split('\n');
    const out = [];
    let inFence = false;
    let fenceChar = '';

    for (let i = 0; i < lines.length; i++) {
        let line = lines[i];
        const topFence = line.match(/^(```+|~~~+)/);

        // 1. 處理程式碼區塊 (Fence)
        if (topFence) {
            if (!inFence) {
                const prev = out[out.length - 1];
                if (prev !== undefined && prev.trim() !== '') out.push('');
                inFence = true;
                fenceChar = topFence[1][0];
                out.push(line);
                continue;
            } else if (topFence[1][0] === fenceChar) {
                inFence = false;
                fenceChar = '';
                out.push(line);
                const next = lines[i + 1];
                if (next !== undefined && next.trim() !== '') out.push('');
                continue;
            }
        }

        if (inFence) { out.push(line); continue; }

        // 2. 處理表格 (Table)
        const isTableLine = /^\s*\|/.test(line);
        if (isTableLine) {
            const prev = out[out.length - 1];
            if (prev !== undefined && prev.trim() !== '' && !/^\s*\|/.test(prev)) {
                out.push('');
            }
            line = line.replace(/(^|[^\\`])\\(?=[A-Za-z])/g, '$1\\\\');
            out.push(line);
            continue;
        }

        // 3. 處理列表項 (List Item) - 為了解決緊貼文字導致解析失敗的問題
        const isListItem = /^\s*(?:\d+\.|[-*+])\s+/.test(line);
        if (isListItem) {
            const prev = out[out.length - 1];
            if (prev !== undefined && prev.trim() !== '') {
                const isPrevListItem = /^\s*(?:\d+\.|[-*+])\s+/.test(prev);
                const isPrevHeading = /^\s*#/.test(prev);
                const isPrevTable = /^\s*\|/.test(prev);
                const isPrevFence = /^\s*(```+|~~~+)/.test(prev);
                
                if (!isPrevListItem && !isPrevHeading && !isPrevTable && !isPrevFence) {
                    out.push('');
                }
            }
        }

        out.push(line);
    }
    return out.join('\n');
}

function wrapTables(root) {
    root.querySelectorAll('table').forEach(table => {
        if (table.parentElement && table.parentElement.classList.contains('table-wrapper')) return;
        const w = document.createElement('div');
        w.className = 'table-wrapper';
        table.parentNode.insertBefore(w, table);
        w.appendChild(table);
    });
}

function replaceMermaid(root) {
    root.querySelectorAll('pre > code').forEach(code => {
        if (!/\blanguage-mermaid\b/.test(code.className || '')) return;
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = code.textContent;
        code.parentElement.replaceWith(div);
    });
}

function highlightAll(root) {
    root.querySelectorAll('pre > code').forEach(code => {
        if (code.classList.contains('hljs')) return;
        if (code.parentElement.querySelector('.mermaid')) return;
        try { hljs.highlightElement(code); } catch (e) { }
    });
}

/* ============================================================
   主流程
   ============================================================ */
const fileInput    = document.getElementById('fileInput');
const reportViewer = document.getElementById('reportViewer');
const loading      = document.getElementById('loading');
const exportWordBtn = document.getElementById('exportWordBtn');

fileInput.addEventListener('change', function (e) {
    const file = e.target.files[0];
    if (!file) return;
    document.getElementById('fileName').textContent = file.name;
    loading.style.display = 'flex';
    exportWordBtn.disabled = true;

    const reader = new FileReader();

    reader.onload = async function (ev) {
        await new Promise(r => requestAnimationFrame(() => setTimeout(r, 30)));
        try {
            const raw = ev.target.result;
            const normalized = normalizeMarkdown(raw);
            const html = marked.parse(normalized);
            const clean = DOMPurify.sanitize(html, {
                ADD_ATTR: ['target','rel','align','colspan','rowspan','class','id',
                           'checked','disabled','type','start','value']
            });

            reportViewer.innerHTML = `<div class="markdown-body">${clean}</div>`;
            const body = reportViewer.querySelector('.markdown-body');

            replaceMermaid(body);
            highlightAll(body);
            wrapTables(body);

            if (body.querySelector('.mermaid')) {
                try { await mermaid.run({ querySelector: '.markdown-body .mermaid' }); }
                catch (err) { console.warn('[mermaid]', err); }
            }

            body.querySelectorAll('a[href^="http"]').forEach(a => {
                a.setAttribute('target', '_blank');
                a.setAttribute('rel', 'noopener noreferrer');
            });

            // 渲染成功後啟用匯出按鈕
            exportWordBtn.disabled = false;

        } catch (err) {
            console.error(err);
            reportViewer.innerHTML = `<p style="color:#ef4444;padding:20px;text-align:center;">渲染錯誤：${err.message}</p>`;
        } finally {
            loading.style.display = 'none';
        }
    };

    reader.onerror = () => { loading.style.display = 'none'; alert('檔案讀取失敗'); };
    reader.readAsText(file, 'UTF-8');
});

document.getElementById('clearBtn').onclick = () => location.reload();

/* ============================================================
   匯出 Word 功能 (使用 MHTML 封裝，保留 HTML 排版與 CSS)
   ============================================================ */
exportWordBtn.addEventListener('click', () => {
    const body = reportViewer.querySelector('.markdown-body');
    if (!body) return;

    // 複製一份 DOM 以避免影響原本網頁畫面
    const clone = body.cloneNode(true);

    // 移除 table-wrapper，避免 Word 排版異常
    clone.querySelectorAll('.table-wrapper').forEach(wrapper => {
        wrapper.replaceWith(...wrapper.childNodes);
    });

    // 取得當前檔名（去掉 .md）
    let filename = document.getElementById('fileName').textContent || 'BIOS_Report';
    filename = filename.replace(/\.md$/i, '');
    
    // 構建 Word 專用的 HTML
    // 為了讓 Word 正確渲染表格與程式碼，這裡寫入內聯 CSS
    const header = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' 
              xmlns:w='urn:schemas-microsoft-com:office:word' 
              xmlns='http://www.w3.org/TR/REC-html40'>
        <head>
            <meta charset='utf-8'>
            <title>${filename}</title>
            <style>
                @page { size: A4; margin: 2cm; }
                body { 
                    font-family: 'Microsoft JhengHei', 'Noto Sans TC', sans-serif; 
                    font-size: 11pt; line-height: 1.5; color: #1e293b;
                }
                h1, h2, h3, h4, h5, h6 { color: #0f172a; margin-top: 1.2em; margin-bottom: 0.5em; }
                h1 { font-size: 18pt; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
                h2 { font-size: 15pt; border-bottom: 1px solid #eee; padding-bottom: 3px; }
                h3 { font-size: 13pt; }
                p { margin: 0.5em 0; }
                ul, ol { margin-top: 0.5em; margin-bottom: 0.5em; padding-left: 20px; }
                li { margin-bottom: 3px; }
                
                /* 表格樣式 */
                table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 10pt; }
                th, td { border: 1px solid #c0c0c0; padding: 6px 10px; text-align: left; vertical-align: top; }
                th { background-color: #f2f2f2; font-weight: bold; }
                
                /* 程式碼區塊 */
                pre { 
                    background-color: #f6f8fa; border: 1px solid #e2e8f0; padding: 10px; 
                    font-family: 'Consolas', 'Courier New', monospace; font-size: 9.5pt; 
                    white-space: pre-wrap; word-wrap: break-word; 
                }
                code { font-family: 'Consolas', 'Courier New', monospace; font-size: 9.5pt; background: #f1f5f9; padding: 2px 4px; }
                pre code { background: transparent; padding: 0; }
                
                /* 其他 */
                blockquote { border-left: 3px solid #ccc; padding-left: 10px; color: #666; margin-left: 0; }
                a { color: #2563eb; text-decoration: underline; }
                hr { border: none; border-top: 1px solid #eee; margin: 20px 0; }
            </style>
        </head>
        <body>`;

    const footer = `</body></html>`;
    const html = header + clone.innerHTML + footer;

    // 加入 BOM (\ufeff) 避免 Word 開啟時中文亂碼
    const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
    const url = URL.createObjectURL(blob);
    
    const link = document.createElement('a');
    link.href = url;
    link.download = `${filename}.doc`; // 使用 .doc 副檔名讓 Word 能直接開啟
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
});
</script>
</body>
</html>
