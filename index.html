<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>TerraEdge • BIOS 上電時序報告檢視器</title>
    <!-- 優雅的等寬字體 & 系統預設無襯線 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <!-- 代碼高亮樣式 (GitHub 風格) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <!-- Mermaid -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <!-- Marked 解析器 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11/marked.min.js"></script>
    <!-- 高亮 js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            background: #f5f7fb;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #1e293b;
            padding: 24px 16px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-container {
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* 頭部 + 上傳區 */
        .header {
            margin-bottom: 28px;
        }

        h1 {
            font-weight: 600;
            font-size: 2rem;
            letter-spacing: -0.01em;
            color: #0b1e33;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #475569;
            margin-bottom: 20px;
            border-left: 4px solid #3b82f6;
            padding-left: 16px;
            font-weight: 400;
        }

        .upload-area {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.02), 0 2px 6px rgba(0,0,0,0.05);
            padding: 20px 28px;
            border: 1px solid #e9eef4;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .upload-label {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
        }

        .file-input-wrapper input {
            position: absolute;
            opacity: 0;
            width: 0.1px;
            height: 0.1px;
        }

        .file-btn {
            background: #1e293b;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 500;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #334155;
        }

        .file-btn:hover {
            background: #0f172a;
            box-shadow: 0 8px 14px rgba(0,0,0,0.08);
            transform: translateY(-1px);
        }

        .file-btn i {
            font-size: 1.2em;
        }

        .drag-hint {
            color: #64748b;
            font-size: 0.95rem;
        }

        .stats-badge {
            background: #f1f5f9;
            padding: 8px 18px;
            border-radius: 40px;
            color: #0b1e33;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .clear-btn {
            background: transparent;
            border: 1px solid #cbd5e1;
            padding: 8px 18px;
            border-radius: 40px;
            color: #475569;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .clear-btn:hover {
            background: #f8fafc;
            border-color: #94a3b8;
        }

        /* 渲染卡片 */
        .report-viewer {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 35px -8px rgba(0,0,0,0.07), 0 5px 12px -4px rgba(0,0,0,0.05);
            padding: 32px 36px;
            margin-top: 24px;
            border: 1px solid #eef2f6;
            flex: 1;
            transition: all 0.2s;
        }

        .placeholder-message {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }

        .placeholder-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* ----- 富內容樣式 (類比 GitHub Markdown 但更精緻) ----- */
        .markdown-body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 15px;
            word-wrap: break-word;
        }

        .markdown-body h1, .markdown-body h2, .markdown-body h3,
        .markdown-body h4, .markdown-body h5, .markdown-body h6 {
            margin-top: 28px;
            margin-bottom: 16px;
            font-weight: 600;
            line-height: 1.3;
            color: #0b1e33;
        }

        .markdown-body h1 { font-size: 2em; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.4em; }
        .markdown-body h2 { font-size: 1.6em; border-bottom: 1px solid #eef2f6; padding-bottom: 0.3em; }
        .markdown-body h3 { font-size: 1.35em; }
        .markdown-body h4 { font-size: 1.15em; }

        .markdown-body p {
            margin-bottom: 16px;
        }

        .markdown-body table {
            display: block;
            width: 100%;
            overflow-x: auto;
            border-collapse: collapse;
            margin: 24px 0;
            font-size: 0.9rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .markdown-body table th {
            background: #f8fafd;
            font-weight: 600;
            color: #1e293b;
            padding: 12px 16px;
            border: 1px solid #dde3e9;
            white-space: nowrap;
        }

        .markdown-body table td {
            padding: 10px 16px;
            border: 1px solid #e4e9f0;
            vertical-align: top;
        }

        .markdown-body table tr:nth-child(even) {
            background-color: #fafcff;
        }

        .markdown-body table tr:hover {
            background-color: #f1f6fe;
        }

        .markdown-body pre {
            background: #f6f8fa;
            border-radius: 14px;
            padding: 18px;
            overflow-x: auto;
            font-size: 0.9rem;
            line-height: 1.5;
            border: 1px solid #e2e8f0;
            margin: 24px 0;
        }

        .markdown-body code {
            font-family: 'JetBrains Mono', 'Cascadia Code', monospace;
            font-size: 0.9em;
            background: #f1f5f9;
            padding: 0.2em 0.4em;
            border-radius: 8px;
            color: #1e293b;
        }

        .markdown-body pre code {
            background: none;
            padding: 0;
            font-size: 0.9rem;
            color: #1e293b;
        }

        .markdown-body blockquote {
            border-left: 4px solid #3b82f6;
            padding: 8px 20px;
            margin: 20px 0;
            background: #f8fafc;
            border-radius: 0 12px 12px 0;
            color: #334155;
        }

        .markdown-body hr {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin: 32px 0;
        }

        .markdown-body .mermaid {
            background: #fdfdfe;
            padding: 16px;
            border-radius: 16px;
            margin: 24px 0;
            text-align: center;
            border: 1px dashed #cbd5e1;
        }

        /* 針對超長表格優化 */
        .table-wrapper {
            overflow-x: auto;
            margin: 24px 0;
            border-radius: 14px;
            border: 1px solid #edf2f7;
        }

        /* 檔案名顯示 */
        .file-name-indicator {
            font-weight: 500;
            color: #2563eb;
            background: #eef2ff;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.85rem;
            margin-left: 8px;
        }

        .footer-note {
            margin-top: 20px;
            text-align: right;
            color: #94a3b8;
            font-size: 0.8rem;
        }

        /* 回應式 */
        @media (max-width: 640px) {
            .report-viewer {
                padding: 20px 16px;
            }
            .upload-area {
                flex-direction: column;
                align-items: flex-start;
            }
            h1 { font-size: 1.7rem; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <h1>
            ⚡ TerraEdge BIOS • 上電時序分析
            <span style="font-size: 0.9rem; background: #dbeafe; color:#1e40af; padding:2px 12px; border-radius:30px; margin-left:12px;">Power On Sequence v4</span>
        </h1>
        <div class="subtitle">硬體初始化 • OEM Hooks • 模組入口追蹤 — 上傳 .md 報告，即刻視覺化</div>

        <div class="upload-area">
            <div class="upload-label">
                <div class="file-input-wrapper">
                    <input type="file" id="fileInput" accept=".md,.markdown,text/markdown" />
                    <label for="fileInput" class="file-btn" id="uploadBtnLabel">
                        <span style="font-size:1.2em;">📂</span> 選擇 Markdown 報告
                    </label>
                </div>
                <span class="drag-hint" id="dragHint">或拖拽 .md 文件至此</span>
                <span id="fileNameDisplay" class="file-name-indicator"></span>
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="stats-badge" id="statsDisplay">
                    <span>📋</span> 等待上傳
                </div>
                <button class="clear-btn" id="clearBtn" title="清空當前報告">🗑️ 清空</button>
            </div>
        </div>
    </div>

    <!-- 報告渲染區域 -->
    <div class="report-viewer" id="reportViewer">
        <div class="placeholder-message">
            <div class="placeholder-icon">📄⬆️</div>
            <h3 style="font-weight: 500; color: #334155;">上傳 BIOS 時序報告 (.md)</h3>
            <p style="margin-top: 8px; opacity: 0.7;">支援表格、代碼高亮、Mermaid 流程圖<br>例如 PowerOnSequence_Enhanced.md</p>
            <div style="margin-top: 24px; font-size: 0.85rem; border-top: 1px dashed #cbd5e1; padding-top: 20px; color: #62748c;">
                ⚙️ 總模組 2878 • OEM Hooks 1774 • 完整硬體流映射
            </div>
        </div>
    </div>
    <div class="footer-note">
        TerraEdge • 增強報告渲染引擎
    </div>
</div>

<script>
    (function(){
        "use strict";

        // ---------- 初始化庫 ----------
        mermaid.initialize({
            startOnLoad: false,
            theme: 'default',
            securityLevel: 'loose',
            fontFamily: 'Inter, sans-serif',
            flowchart: { useMaxWidth: true, htmlLabels: true, curve: 'basis' }
        });

        // 配置 marked
        marked.setOptions({
            gfm: true,
            breaks: true,
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try {
                        return hljs.highlight(code, { language: lang }).value;
                    } catch (e) {}
                }
                return code;
            }
        });

        // DOM 元素
        const fileInput = document.getElementById('fileInput');
        const reportViewer = document.getElementById('reportViewer');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const statsDisplay = document.getElementById('statsDisplay');
        const clearBtn = document.getElementById('clearBtn');
        const dragHint = document.getElementById('dragHint');
        const uploadLabel = document.getElementById('uploadBtnLabel');

        // 當前檔案名 & 內容 (用於清空後恢復占位)
        let currentFileName = '';
        let currentMarkdown = '';

        // ---------- 輔助: 渲染 Markdown 並處理 Mermaid ----------
        function renderMarkdownToContainer(markdownText, container) {
            if (!markdownText || markdownText.trim() === '') {
                showPlaceholder();
                return;
            }

            // 先用 marked 解析為 HTML
            let html = marked.parse(markdownText);
            
            // 創建一個臨時容器來構建安全內容
            const tempDiv = document.createElement('div');
            tempDiv.className = 'markdown-body';
            tempDiv.innerHTML = html;

            // ----- 處理 Mermaid 代碼塊：將 <pre><code class="language-mermaid"> 轉換為 <div class="mermaid"> -----
            const mermaidBlocks = tempDiv.querySelectorAll('pre code.language-mermaid');
            mermaidBlocks.forEach(codeBlock => {
                const pre = codeBlock.parentNode;
                const mermaidCode = codeBlock.textContent;
                const mermaidDiv = document.createElement('div');
                mermaidDiv.className = 'mermaid';
                mermaidDiv.textContent = mermaidCode;
                pre.replaceWith(mermaidDiv);
            });

            // 額外: 如果有 <code class="language-mermaid"> 沒有被 pre 包裹 (極少數情況)
            const looseMermaid = tempDiv.querySelectorAll('code.language-mermaid');
            looseMermaid.forEach(code => {
                if (code.parentNode && code.parentNode.tagName !== 'PRE') {
                    const mermaidDiv = document.createElement('div');
                    mermaidDiv.className = 'mermaid';
                    mermaidDiv.textContent = code.textContent;
                    code.replaceWith(mermaidDiv);
                }
            });

            // 清空容器並放入新內容
            container.innerHTML = '';
            container.appendChild(tempDiv);

            // 高亮所有代碼塊 (marked已經通過highlight處理，但動態添加的或未被處理的可以再跑一次)
            container.querySelectorAll('pre code:not(.language-mermaid)').forEach((block) => {
                // 移除已有的 hljs 類避免重複，但保留高亮
                if (!block.classList.contains('hljs')) {
                    hljs.highlightElement(block);
                }
            });

            // 渲染 Mermaid 圖表
            const mermaidElements = container.querySelectorAll('.mermaid');
            if (mermaidElements.length > 0) {
                // 避免 mermaid 重複渲染報錯，清除已存在的data-processed
                mermaidElements.forEach(el => { el.removeAttribute('data-processed'); });
                try {
                    mermaid.run({ nodes: mermaidElements });
                } catch (e) {
                    console.warn('Mermaid rendering error:', e);
                }
            }

            // 為所有表格外包裹一層滾動容器 (提升移動端體驗)
            const tables = container.querySelectorAll('table');
            tables.forEach(table => {
                if (!table.parentNode.classList.contains('table-wrapper')) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'table-wrapper';
                    table.parentNode.insertBefore(wrapper, table);
                    wrapper.appendChild(table);
                }
            });

            // 更新統計資訊：嘗試從內容提取模組總數和 hooks (簡單展示)
            updateStatsFromMarkdown(markdownText);
        }

        // 顯示占位元歡迎內容
        function showPlaceholder() {
            reportViewer.innerHTML = `
                <div class="placeholder-message">
                    <div class="placeholder-icon">📄⬆️</div>
                    <h3 style="font-weight: 500; color: #334155;">上傳 BIOS 時序報告 (.md)</h3>
                    <p style="margin-top: 8px; opacity: 0.7;">支援表格、代碼高亮、Mermaid 流程圖<br>例如 PowerOnSequence_Enhanced.md</p>
                    <div style="margin-top: 24px; font-size: 0.85rem; border-top: 1px dashed #cbd5e1; padding-top: 20px; color: #62748c;">
                        ⚙️ 總模組 2878 • OEM Hooks 1774 • 完整硬體流映射
                    </div>
                </div>
            `;
            fileNameDisplay.textContent = '';
            statsDisplay.innerHTML = `<span>📋</span> 等待上傳`;
            currentFileName = '';
            currentMarkdown = '';
        }

        // 簡單提取統計 (如果檔內容包含特徵數位)
        function updateStatsFromMarkdown(md) {
            // 提取總模組數 (Total Modules: 2878)
            const moduleMatch = md.match(/Total Modules:\s*(\d+)/i);
            const hookMatch = md.match(/Total OEM Hooks:\s*(\d+)/i);
            let statsText = '';
            if (moduleMatch) {
                statsText = `📦 模組 ${moduleMatch[1]}`;
            } else {
                statsText = `📄 已載入`;
            }
            if (hookMatch) {
                statsText += ` • 🪝 Hooks ${hookMatch[1]}`;
            } else {
                statsText += ` • 報告`;
            }
            statsDisplay.innerHTML = `<span>📋</span> ${statsText}`;
        }

        // 讀取文件並渲染
        function loadFileAndRender(file) {
            if (!file) return;
            
            // 檢查副檔名 (可選)
            const fileName = file.name;
            currentFileName = fileName;
            fileNameDisplay.textContent = `📎 ${fileName}`;

            const reader = new FileReader();
            reader.onload = (e) => {
                const content = e.target.result;
                currentMarkdown = content;
                renderMarkdownToContainer(content, reportViewer);
            };
            reader.onerror = () => {
                alert('讀取檔失敗，請重試。');
                showPlaceholder();
            };
            reader.readAsText(file, 'UTF-8');
        }

        // 處理上傳
        function handleFileSelect(file) {
            if (file) {
                loadFileAndRender(file);
            }
        }

        // ---------- 事件綁定 ----------
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFileSelect(file);
            }
            // 允許重複上傳同一檔: 清空input值
            fileInput.value = '';
        });

        // 拖拽上傳
        const uploadArea = document.querySelector('.upload-area');
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
            });
        });

        uploadArea.addEventListener('dragover', () => {
            uploadArea.style.backgroundColor = '#f8fafc';
            uploadArea.style.borderColor = '#3b82f6';
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.backgroundColor = '';
            uploadArea.style.borderColor = '#e9eef4';
        });

        uploadArea.addEventListener('drop', (e) => {
            uploadArea.style.backgroundColor = '';
            uploadArea.style.borderColor = '#e9eef4';
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const file = files[0];
                if (file.name.endsWith('.md') || file.name.endsWith('.markdown') || file.type === 'text/markdown' || file.type === 'text/plain') {
                    handleFileSelect(file);
                } else {
                    alert('請上傳 .md 或 .markdown 文件');
                }
            }
        });

        // 清空按鈕
        clearBtn.addEventListener('click', () => {
            showPlaceholder();
            fileInput.value = '';
            currentMarkdown = '';
            currentFileName = '';
            fileNameDisplay.textContent = '';
        });

        // 點擊上傳區域（除按鈕外）也可觸發檔選擇？ 但已經有按鈕了，不過可以增強: 點擊label即可

        // 如果用戶希望展示示例？我們可以提供一個快速示例載入 (可選) 但不強制。
        // 但為了體驗，增加一個隱藏功能: 按兩下標題載入內置樣例? 不做了，保持簡潔。

        // 若初始沒有任何內容，顯示占位元
        // 但為了演示，我們可以預先內置一小段樣例？為了符合“上傳附件”的說明，不預載入。
        // 但可以添加一個“載入演示”的小連結？在右上？ 為了不干擾，省略。

        // 如果使用者通過拖拽等方式，但誤操作，已經完善。

        // 額外優化：當通過檔選擇後，如果未選檔，不變化。
        
        // 自我調整：如果頁面有殘留的mermaid未處理，但已經處理。
        console.log('✅ TerraEdge Report Viewer 已就緒 — 上傳 .md 即可渲染');
    })();
</script>
<!-- 確保所有代碼高亮語言包 (基礎) -->
<script>hljs.highlightAll();</script>
</body>
</html>
